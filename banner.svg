        <path d="M12,6 C8.7,6 6,8.7 6,12 C6,14.6 7.7,16.8 10.1,17.6 C10.4,17.7 10.5,17.5 10.5,17.3 C10.5,17.1 10.5,16.6 10.5,16 C8.8,16.4 8.5,15.2 8.5,15.2 C8.2,14.5 7.8,14.3 7.8,14.3 C7.2,13.9 7.8,13.9 7.8,13.9 C8.5,14 8.8,14.6 8.8,14.6 C9.4,15.7 10.5,15.4 10.9,15.2 C11,14.7 11.2,14.4 11.4,14.2 C9.7,14 7.9,13.3 7.9,10.4 C7.9,9.6 8.2,8.9 8.7,8.4 C8.6,8.2 8.3,7.4 8.8,6.4 C8.8,6.4 9.4,6.2 10.8,7.1 C11.4,6.9 12,6.8 12.6,6.8 C13.2,6.8 13.8,6.9 14.4,7.1 C15.8,6.2 16.4,6.4 16.4,6.4 C16.9,7.4 16.6,8.2 16.5,8.4 C17,8.9 17.3,9.6 17.3,10.4 C17.3,13.3 15.5,14 13.8,14.2 C14.1,14.5 14.3,15 14.3,15.7 C14.3,16.7 14.3,17.5 14.3,17.7 C14.3,17.9 14.4,18.1 14.7,18 C17.1,17.2 18.8,15 18.8,12.4 C18.6,8.7 15.9,6 12,6 Z" fill="#FFF4E5" transform="scale(0.85) translate(2, 2)"/>
        <text x="32" y="20" fill="#FFF4E5" font-size="11" font-weight="600" class="font-sans">GitHub</text>
