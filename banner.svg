<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="100%" height="auto">
  <defs>
    <!-- Fonts Import & Fallback Stack -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      .font-heading { font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; }

      /* Glassmorphism Styling */
      .glass-card {
        fill: rgba(20, 20, 20, 0.55);
        stroke: rgba(255, 180, 70, 0.25);
        stroke-width: 1.2px;
        backdrop-filter: blur(20px);
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
        transition: all 0.4s ease;
      }
      .glass-card:hover {
        stroke: rgba(255, 180, 70, 0.5);
        fill: rgba(25, 25, 25, 0.65);
      }

      /* Glow & Bloom Filters */
      .sun-glow {
        animation: sunPulse 6s ease-in-out infinite alternate;
        transform-origin: 600px 250px;
      }
      @keyframes sunPulse {
        0% { opacity: 0.65; transform: scale(0.98); }
        100% { opacity: 0.95; transform: scale(1.05); }
      }

      /* Cloud Motion (40s) */
      .cloud-move-1 {
        animation: cloudDrift1 40s linear infinite;
      }
      .cloud-move-2 {
        animation: cloudDrift2 55s linear infinite;
      }
      @keyframes cloudDrift1 {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(1300px); }
      }
      @keyframes cloudDrift2 {
        0% { transform: translateX(1200px); }
        100% { transform: translateX(-200px); }
      }

      /* Petals Float (14s) */
      .petal {
        animation: petalFall 14s ease-in-out infinite;
        transform-origin: center;
      }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 3s; }
      .p3 { animation-delay: 6s; }
      .p4 { animation-delay: 9s; }
      .p5 { animation-delay: 11s; }

      @keyframes petalFall {
        0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translate(-180px, 540px) rotate(420deg); opacity: 0; }
      }

      /* Typing Terminal Effect */
      .cursor {
        animation: blink 700ms steps(2, start) infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Hologram Scan Line (3.5s) */
      .scanner-line {
        animation: scanMove 3.5s ease-in-out infinite alternate;
      }
      @keyframes scanMove {
        0% { transform: translateY(20px); opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { transform: translateY(480px); opacity: 0.2; }
      }

      /* Particle Float (20s) */
      .particle {
        animation: particleFloat 20s ease-in-out infinite alternate;
      }
      @keyframes particleFloat {
        0% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(15px, -25px); opacity: 0.8; }
        100% { transform: translate(-10px, -50px); opacity: 0.2; }
      }

      /* Shimmer text effect */
      .shimmer-text {
        background: linear-gradient(90deg, #FFF4E5 0%, #F7C873 50%, #FFB347 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Badge hover effect */
      .skill-pill {
        transition: transform 0.2s ease, fill 0.2s ease;
      }
      .skill-pill:hover {
        transform: translateY(-2px);
      }
    </style>

    <!-- Warm Sunset Gradients -->
    <linearGradient id="bgOverlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151515" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#2B1810" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4B5" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FF9A3C" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#D97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#F7C873"/>
      <stop offset="100%" stop-color="#FF9A3C"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 180, 70, 0.4)"/>
      <stop offset="100%" stop-color="rgba(217, 119, 6, 0.1)"/>
    </linearGradient>

    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 180, 70, 0)"/>
      <stop offset="20%" stop-color="rgba(255, 180, 70, 0.4)"/>
      <stop offset="50%" stop-color="rgba(247, 200, 115, 0.8)"/>
      <stop offset="80%" stop-color="rgba(255, 180, 70, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 180, 70, 0)"/>
    </linearGradient>
  </defs>

  <!-- Background Base Image (Referenced to avoid huge SVG file size) -->
  <image href="assets/anime-character.png" x="0" y="0" width="1200" height="520" preserveAspectRatio="xMidYMid slice" />
  
  <!-- Subtle Vignette & Warm Tint -->
  <rect width="1200" height="520" fill="url(#bgOverlay)" />

  <!-- Animated Sunset Bloom behind Horizon -->
  <circle cx="680" cy="240" r="140" fill="url(#sunGlowGrad)" class="sun-glow" />

  <!-- Ambient Moving Sky Particles -->
  <g class="particle" opacity="0.6">
    <circle cx="200" cy="150" r="2" fill="#F7C873" />
    <circle cx="350" cy="80" r="1.5" fill="#FFB347" />
    <circle cx="500" cy="180" r="2.5" fill="#FFF4E5" />
    <circle cx="850" cy="120" r="1.8" fill="#F7C873" />
    <circle cx="1020" cy="220" r="2" fill="#FF9A3C" />
  </g>

  <!-- Animated Floating Sakura Petals -->
  <g opacity="0.85">
    <path class="petal p1" d="M 950,20 Q 958,10 964,22 Q 956,34 948,22 Z" fill="#FFB7C5" />
    <path class="petal p2" d="M 1100,50 Q 1108,40 1114,52 Q 1106,64 1098,52 Z" fill="#FF8095" />
    <path class="petal p3" d="M 820,10 Q 828,0 834,12 Q 826,24 818,12 Z" fill="#FFB7C5" opacity="0.7"/>
    <path class="petal p4" d="M 1000,100 Q 1008,90 1014,102 Q 1006,114 998,102 Z" fill="#FF5376" />
    <path class="petal p5" d="M 750,40 Q 758,30 764,42 Q 756,54 748,42 Z" fill="#FFB7C5" />
