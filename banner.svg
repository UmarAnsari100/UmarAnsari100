      <text x="14" y="22" fill="#F7C873" font-size="14" class="font-mono">“</text>
      <text x="26" y="24" fill="#E2E8F0" font-size="11" class="font-sans" opacity="0.95">Building digital experiences</text>
      <text x="26" y="40" fill="#E2E8F0" font-size="11" class="font-sans" opacity="0.95">that are not just functional,</text>
