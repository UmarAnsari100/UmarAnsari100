    <circle cx="40" cy="24" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="24" r="5" fill="#27C93F" />
    <text x="75" y="28" fill="#F7C873" font-size="11" class="font-mono" opacity="0.8">user@UmarAnsari100:~$</text>

