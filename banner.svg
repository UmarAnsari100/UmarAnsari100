    <!-- Main Right Panel Glass Container -->
    <rect x="0" y="0" width="370" height="440" rx="20" ry="20" class="glass-card" />

    <!-- Panel 1: Tech Stack Grid Header -->
    <g transform="translate(24, 20)">
