        <rect width="102" height="34" rx="8" fill="rgba(255, 255, 255, 0.75)" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1"/>
        <rect x="12" y="9" width="14" height="14" rx="2" fill="#EAB308"/>
        <text x="14" y="20" fill="#000" font-size="9" font-weight="800" class="font-mono">JS</text>
        <text x="34" y="21" fill="#0F172A" font-size="11" font-weight="600" class="font-sans">JavaScript</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(222, 0)" class="skill-pill-light">
        <rect width="100" height="34" rx="8" fill="rgba(255, 255, 255, 0.75)" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1"/>
        <rect x="12" y="9" width="14" height="14" rx="2" fill="#2563EB"/>
        <text x="14" y="20" fill="#FFF" font-size="9" font-weight="800" class="font-mono">TS</text>
        <text x="32" y="21" fill="#0F172A" font-size="11" font-weight="600" class="font-sans">TypeScript</text>
      </g>
      <!-- Next.js -->
      <g transform="translate(0, 42)" class="skill-pill-light">
        <rect width="98" height="34" rx="8" fill="rgba(255, 255, 255, 0.75)" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1"/>
        <circle cx="20" cy="17" r="7" fill="#0F172A"/>
        <text x="17" y="20" fill="#FFF" font-size="8" font-weight="900" class="font-sans">N</text>
        <text x="34" y="21" fill="#0F172A" font-size="11" font-weight="600" class="font-sans">Next.js</text>
      </g>
      <!-- Tailwind -->
      <g transform="translate(110, 42)" class="skill-pill-light">
        <rect width="102" height="34" rx="8" fill="rgba(255, 255, 255, 0.75)" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1"/>
        <path d="M14,17 C15,14 17,14 18,15.5 C19,17 21,17.5 22.5,16" fill="none" stroke="#0284C7" stroke-width="2"/>
        <text x="32" y="21" fill="#0F172A" font-size="11" font-weight="600" class="font-sans">Tailwind</text>
      </g>
      <!-- PHP -->
      <g transform="translate(222, 42)" class="skill-pill-light">
        <rect width="100" height="34" rx="8" fill="rgba(255, 255, 255, 0.75)" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1"/>
        <text x="14" y="21" fill="#4F46E5" font-size="10" font-weight="800" class="font-mono">PHP</text>
        <text x="42" y="21" fill="#0F172A" font-size="11" font-weight="600" class="font-sans">Backend</text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="138" x2="346" y2="138" stroke="rgba(217, 119, 6, 0.2)" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Animated Code Editor Header -->
    <g transform="translate(24, 154)">
      <circle cx="6" cy="6" r="3" fill="#EF4444" />
      <circle cx="16" cy="6" r="3" fill="#F59E0B" />
      <circle cx="26" cy="6" r="3" fill="#10B981" />
      <text x="40" y="9" fill="#78350F" font-size="11" class="font-mono" font-weight="700">buildDreams.js</text>
    </g>

    <!-- Code Editor Box -->
    <g transform="translate(24, 175)">
      <rect width="322" height="235" rx="10" fill="rgba(255, 255, 255, 0.85)" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1"/>
      
      <!-- Line Numbers -->
      <g font-size="11" class="font-mono" fill="#94A3B8">
        <text x="14" y="26">01</text>
        <text x="14" y="46">02</text>
        <text x="14" y="66">03</text>
        <text x="14" y="86">04</text>
        <text x="14" y="106">05</text>
        <text x="14" y="126">06</text>
        <text x="14" y="146">07</text>
        <text x="14" y="166">08</text>
        <text x="14" y="186">09</text>
        <text x="14" y="206">10</text>
      </g>

      <!-- Syntax Highlighting Light Mode -->
      <g font-size="11" class="font-mono" transform="translate(42, 0)">
        <text x="0" y="26" fill="#E11D48">function <tspan fill="#D97706">buildDreams</tspan>() {</text>
        <text x="12" y="46" fill="#E11D48">return <tspan fill="#0F172A">{</tspan></text>
        <text x="24" y="66" fill="#0284C7">discipline<tspan fill="#0F172A">:</tspan> <tspan fill="#D97706">"Daily"</tspan><tspan fill="#0F172A">,</tspan></text>
        <text x="24" y="86" fill="#0284C7">consistency<tspan fill="#0F172A">:</tspan> <tspan fill="#B45309">true</tspan><tspan fill="#0F172A">,</tspan></text>
        <text x="24" y="106" fill="#0284C7">learning<tspan fill="#0F172A">:</tspan> <tspan fill="#D97706">"Never Stops"</tspan><tspan fill="#0F172A">,</tspan></text>
        <text x="24" y="126" fill="#0284C7">goal<tspan fill="#0F172A">:</tspan> <tspan fill="#D97706">"Impact"</tspan><tspan fill="#0F172A">,</tspan></text>
        <text x="24" y="146" fill="#0284C7">passion<tspan fill="#0F172A">:</tspan> <tspan fill="#D97706">"Infinite"</tspan></text>
        <text x="12" y="166" fill="#0F172A">};</text>
        <text x="0" y="186" fill="#0F172A">}</text>
        <g transform="translate(0, 206)">
          <text x="0" y="0" fill="#64748B" font-style="italic">// Turning ideas into reality 🚀</text>
          <rect x="205" y="-10" width="7" height="13" fill="#D97706" class="cursor"/>
        </g>
      </g>
