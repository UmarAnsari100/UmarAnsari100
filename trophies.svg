<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="100%" height="auto">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');

      .font-heading { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; }

      .glass-card {
        fill: rgba(18, 18, 18, 0.65);
        stroke: rgba(255, 180, 70, 0.25);
        stroke-width: 1.2px;
        backdrop-filter: blur(20px);
        filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.55));
      }

      .badge-cell {
        animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: center;
        transition: transform 0.3s ease;
      }
      .badge-cell:hover {
        transform: translateY(-4px) scale(1.05);
      }

      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1); }
      }

      .shine-sweep {
        animation: shine 4s ease-in-out infinite;
      }
      @keyframes shine {
        0% { transform: translateX(-100px) rotate(20deg); opacity: 0; }
        20% { opacity: 0.6; }
        50% { transform: translateX(500px) rotate(20deg); opacity: 0; }
        100% { opacity: 0; }
      }
    </style>

    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5"/>
      <stop offset="50%" stop-color="#F7C873"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="silverMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(255, 248, 240, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>

    <clipPath id="trophiesClip">
      <rect width="480" height="140" rx="16" ry="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#trophiesClip)">
    <rect width="480" height="140" rx="16" ry="16" class="glass-card" />

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#F7C873" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">// GITHUB ACHIEVEMENTS &amp; TROPHIES</text>
    </g>

    <!-- 4 Badges Row -->
    <g transform="translate(30, 42)">

      <!-- Badge 1: Pull Shark -->
      <g transform="translate(0, 0)" class="badge-cell" style="animation-delay: 0.1s;">
        <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="url(#goldMedal)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.2"/>
        <path d="M40,25 L48,40 L32,40 Z M35,42 L45,42 L40,52 Z" fill="#151515"/>
        <text x="40" y="94" text-anchor="middle" fill="#FFF4E5" font-size="10" font-weight="600" class="font-sans">Pull Shark</text>
        <text x="40" y="106" text-anchor="middle" fill="#F7C873" font-size="8" class="font-mono">x3</text>
      </g>

      <!-- Badge 2: Quickdraw -->
      <g transform="translate(110, 0)" class="badge-cell" style="animation-delay: 0.25s;">
        <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="url(#goldMedal)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.2"/>
        <circle cx="40" cy="40" r="12" fill="none" stroke="#151515" stroke-width="3"/>
        <path d="M40,24 L40,40 L48,40" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round"/>
        <text x="40" y="94" text-anchor="middle" fill="#FFF4E5" font-size="10" font-weight="600" class="font-sans">Quickdraw</text>
        <text x="40" y="106" text-anchor="middle" fill="#F7C873" font-size="8" class="font-mono">x2</text>
      </g>

      <!-- Badge 3: Pair Extraordinaire -->
      <g transform="translate(220, 0)" class="badge-cell" style="animation-delay: 0.4s;">
        <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="url(#silverMedal)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.2"/>
        <circle cx="32" cy="36" r="7" fill="#151515"/>
        <circle cx="48" cy="36" r="7" fill="#151515"/>
        <text x="40" y="94" text-anchor="middle" fill="#FFF4E5" font-size="10" font-weight="600" class="font-sans">Pair Extra</text>
        <text x="40" y="106" text-anchor="middle" fill="#F7C873" font-size="8" class="font-mono">x2</text>
      </g>

      <!-- Badge 4: Starstruck -->
      <g transform="translate(330, 0)" class="badge-cell" style="animation-delay: 0.55s;">
        <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="url(#goldMedal)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.2"/>
        <path d="M40 25L43.09 33.26L52 34.27L45.5 39.14L47.18 48.02L40 43.77L32.82 48.02L34.5 39.14L28 34.27L36.91 33.26L40 25Z" fill="#151515"/>
        <text x="40" y="94" text-anchor="middle" fill="#FFF4E5" font-size="10" font-weight="600" class="font-sans">Starstruck</text>
        <text x="40" y="106" text-anchor="middle" fill="#F7C873" font-size="8" class="font-mono">x4</text>
      </g>

    </g>

    <!-- Holographic Shine Sweep -->
    <rect x="0" y="0" width="80" height="140" fill="url(#shineGrad)" class="shine-sweep" />
  </g>
</svg>
