<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="100%" height="auto">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');

      .font-heading { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; }

      .glass-card {
        fill: rgba(20, 20, 20, 0.6);
        stroke: rgba(255, 180, 70, 0.25);
        stroke-width: 1.2px;
        backdrop-filter: blur(20px);
        filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.5));
      }

      .bar-animate {
        animation: fillBar 2s ease-out forwards;
        transform-origin: left;
      }
      @keyframes fillBar {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
    </style>

    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="phpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#777BB4"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="cssGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="480" height="220" rx="16" ry="16" class="glass-card" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" fill="#F7C873"/>
    <text x="24" y="14" fill="#FFF4E5" font-size="14" font-weight="700" class="font-heading">Most Used Languages</text>
  </g>

  <!-- Stacked Full Width Language Distribution Bar -->
  <g transform="translate(24, 60)">
    <rect width="432" height="10" rx="5" fill="rgba(255, 255, 255, 0.1)"/>
    <!-- JS Segment (42%) -->
    <rect x="0" y="0" width="181" height="10" rx="5" fill="url(#jsGrad)" class="bar-animate"/>
    <!-- TS / React Segment (28%) -->
    <rect x="183" y="0" width="120" height="10" rx="5" fill="url(#tsGrad)" class="bar-animate"/>
    <!-- PHP Segment (18%) -->
    <rect x="305" y="0" width="77" height="10" rx="5" fill="url(#phpGrad)" class="bar-animate"/>
    <!-- CSS / Tailwind Segment (12%) -->
    <rect x="384" y="0" width="48" height="10" rx="5" fill="url(#cssGrad)" class="bar-animate"/>
  </g>

  <!-- Language List Breakdown -->
  <g transform="translate(24, 100)" font-size="12" class="font-sans">
    <!-- JavaScript -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#F7DF1E"/>
      <text x="18" y="10" fill="#E2E8F0" font-weight="500">JavaScript</text>
      <text x="200" y="10" fill="#F7C873" font-weight="700" class="font-mono">42.5%</text>
    </g>

    <!-- TypeScript & React -->
    <g transform="translate(230, 0)">
      <circle cx="6" cy="6" r="5" fill="#3178C6"/>
      <text x="18" y="10" fill="#E2E8F0" font-weight="500">TypeScript / React</text>
      <text x="200" y="10" fill="#F7C873" font-weight="700" class="font-mono">28.0%</text>
    </g>

    <!-- PHP & Backend -->
    <g transform="translate(0, 36)">
      <circle cx="6" cy="6" r="5" fill="#777BB4"/>
      <text x="18" y="10" fill="#E2E8F0" font-weight="500">PHP / MySQL</text>
      <text x="200" y="10" fill="#F7C873" font-weight="700" class="font-mono">18.0%</text>
    </g>

    <!-- HTML & CSS / Tailwind -->
    <g transform="translate(230, 36)">
      <circle cx="6" cy="6" r="5" fill="#FFB347"/>
      <text x="18" y="10" fill="#E2E8F0" font-weight="500">Tailwind CSS / HTML</text>
      <text x="200" y="10" fill="#F7C873" font-weight="700" class="font-mono">11.5%</text>
    </g>
  </g>
</svg>
