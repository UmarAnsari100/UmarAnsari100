<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="auto">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');

      .font-heading { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'IBM Plex Mono', monospace; }
      .font-sans { font-family: 'Inter', -apple-system, sans-serif; }

      .badge-glass {
        fill: rgba(22, 22, 22, 0.75);
        stroke: rgba(255, 180, 70, 0.3);
        stroke-width: 1.5px;
        backdrop-filter: blur(20px);
        filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.6));
      }

      .lanyard-strap {
        fill: none;
        stroke: url(#strapGrad);
        stroke-width: 12;
        stroke-linecap: round;
      }

      .status-pulse {
        animation: pulseDot 2s ease-in-out infinite;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
    </style>

    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#F7C873"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="clipMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4D4D8"/>
      <stop offset="50%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
  </defs>

  <!-- Animated Pendulum Swing Group -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 200 0; 2 200 0; -2 200 0" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>

    <!-- Lanyard Strap Ribbons -->
    <path d="M 160,-20 L 192,55" class="lanyard-strap" />
    <path d="M 240,-20 L 208,55" class="lanyard-strap" />

    <!-- Metallic Buckle & Hole -->
    <rect x="186" y="45" width="28" height="22" rx="4" fill="url(#clipMetal)" stroke="#18181B" stroke-width="1"/>
    <circle cx="200" cy="56" r="5" fill="#09090B"/>
    <rect x="194" y="65" width="12" height="18" rx="2" fill="url(#clipMetal)"/>

    <!-- ID Badge Body -->
    <g transform="translate(40, 80)">
      <!-- Main Badge Card -->
      <rect width="320" height="420" rx="20" class="badge-glass" />
      
      <!-- Top Accent Banner Strip -->
      <path d="M 0,20 Q 0,0 20,0 L 300,0 Q 320,0 320,20 L 320,40 L 0,40 Z" fill="url(#badgeGold)" />
      <text x="160" y="26" text-anchor="middle" fill="#151515" font-size="11" font-weight="700" class="font-mono" letter-spacing="2">OFFICIAL PASSPORT</text>

      <!-- Clip Slot Cutout -->
      <rect x="135" y="10" width="50" height="8" rx="4" fill="#0D0D0D" />

      <!-- Avatar Photo Box -->
      <g transform="translate(110, 60)">
        <rect width="100" height="100" rx="50" fill="rgba(35, 35, 35, 0.8)" stroke="url(#badgeGold)" stroke-width="2.5"/>
        <image href="assets/anime-character.png" x="-20" y="-10" width="140" height="140" clip-path="url(#avatarClip)" />
        <clipPath id="avatarClip">
          <circle cx="50" cy="50" r="47" />
        </clipPath>
      </g>

      <!-- Developer Info -->
      <g text-anchor="middle" transform="translate(160, 185)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="700" class="font-heading">Muhammad Umar</text>
        <text x="0" y="24" fill="#F7C873" font-size="18" font-weight="700" class="font-heading">Ansari</text>
        
        <text x="0" y="48" fill="#FFB347" font-size="12" font-weight="600" class="font-sans">Full-Stack Web Developer</text>
        
        <rect x="-110" y="62" width="220" height="1" fill="rgba(255, 180, 70, 0.2)"/>
        
        <text x="0" y="82" fill="#E2E8F0" font-size="11" font-weight="500" class="font-sans">BS Computer Science</text>
        <text x="0" y="98" fill="#94A3B8" font-size="10" class="font-sans">HITEC University, Taxila</text>
        
        <text x="0" y="120" fill="#CBD5E1" font-size="10" class="font-sans">📍 Rawalpindi, Pakistan</text>
      </g>

      <!-- Availability Status Badge -->
      <g transform="translate(60, 335)">
        <rect x="0" y="0" width="200" height="28" rx="14" fill="rgba(39, 201, 63, 0.15)" stroke="#27C93F" stroke-width="1.2"/>
        <circle cx="20" cy="14" r="4" fill="#27C93F" class="status-pulse"/>
        <text x="32" y="18" fill="#4ADE80" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
      </g>

      <!-- Micro Barcode Footer -->
      <g transform="translate(60, 380)" opacity="0.6">
        <rect x="0" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="6" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="10" y="0" width="6" height="20" fill="#F7C873"/>
        <rect x="18" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="22" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="28" y="0" width="8" height="20" fill="#F7C873"/>
        <rect x="38" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="42" y="0" width="6" height="20" fill="#F7C873"/>
        <rect x="50" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="56" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="60" y="0" width="8" height="20" fill="#F7C873"/>
        <rect x="70" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="76" y="0" width="6" height="20" fill="#F7C873"/>
        <rect x="84" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="88" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="94" y="0" width="8" height="20" fill="#F7C873"/>
        <rect x="104" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="108" y="0" width="6" height="20" fill="#F7C873"/>
        <rect x="116" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="122" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="126" y="0" width="8" height="20" fill="#F7C873"/>
        <rect x="136" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="142" y="0" width="6" height="20" fill="#F7C873"/>
        <rect x="150" y="0" width="2" height="20" fill="#F7C873"/>
        <rect x="154" y="0" width="4" height="20" fill="#F7C873"/>
        <rect x="160" y="0" width="8" height="20" fill="#F7C873"/>
        <rect x="170" y="0" width="4" height="20" fill="#F7C873" />
        <text x="200" y="14" fill="#94A3B8" font-size="9" class="font-mono">DEV-100</text>
      </g>

    </g>
  </g>
</svg>
